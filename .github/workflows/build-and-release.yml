name: Build and Release

on:
  push:
    branches:
      - '**'

jobs:
  detect_version_change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      current_version: ${{ steps.version_check.outputs.current_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect package version change
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          echo "[Detect Version Change] Event: ${{ github.event_name }}"
          echo "[Detect Version Change] Ref: ${{ github.ref }}"
          echo "[Detect Version Change] Ref name: ${{ github.ref_name }}"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "[Detect Version Change] Current package.json version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          BEFORE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          echo "[Detect Version Change] BEFORE_SHA: ${BEFORE_SHA:-<empty>}"

          VERSION_CHANGED="false"

          if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "$ZERO_SHA" ]]; then
            echo "[Detect Version Change] No valid previous SHA (new branch or first push)."
            VERSION_CHANGED="true"
          else
            PREV_FILE=$(mktemp)
            if git show "$BEFORE_SHA:package.json" > "$PREV_FILE" 2>/dev/null; then
              PREV_VERSION=$(node -e "const fs=require('fs'); const p=process.argv[1]; const j=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(j.version || '')" "$PREV_FILE")
              echo "[Detect Version Change] Previous package.json version at BEFORE_SHA: ${PREV_VERSION:-<missing>}"
            else
              PREV_VERSION=""
              echo "[Detect Version Change] Could not read package.json at BEFORE_SHA. Treating as changed."
            fi
            rm -f "$PREV_FILE"

            if [[ -z "$PREV_VERSION" || "$PREV_VERSION" != "$CURRENT_VERSION" ]]; then
              VERSION_CHANGED="true"
            fi
          fi

          echo "[Detect Version Change] version_changed=$VERSION_CHANGED"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"

  build:
    name: Build Tauri App
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: always
      CARGO_TERM_PROGRESS_WIDTH: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
          if-no-files-found: warn

  release:
    name: Auto Release on Version Change
    needs:
      - detect_version_change
      - build
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref_name == 'master'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release tag exists
        id: tag_check
        if: needs.detect_version_change.outputs.version_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ needs.detect_version_change.outputs.current_version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log release decision
        shell: bash
        run: |
          echo "[Release] Branch: ${{ github.ref_name }}"
          echo "[Release] Current version: ${{ needs.detect_version_change.outputs.current_version }}"
          echo "[Release] version_changed: ${{ needs.detect_version_change.outputs.version_changed }}"
          echo "[Release] tag_exists: ${{ steps.tag_check.outputs.tag_exists || 'not-checked' }}"

      - name: Download build artifacts
        if: needs.detect_version_change.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: tauri-bundle
          path: dist-artifacts

      - name: Create GitHub release
        if: needs.detect_version_change.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect_version_change.outputs.current_version }}
          name: GameLibrary v${{ needs.detect_version_change.outputs.current_version }}
          generate_release_notes: true
          files: |
            dist-artifacts/**
