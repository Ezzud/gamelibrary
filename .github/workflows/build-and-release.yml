name: Build and Release

on:
  push:
    branches:
      - '**'

jobs:
  detect_version_change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      current_version: ${{ steps.version_check.outputs.current_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect package version change
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          echo "[Detect Version Change] Event: ${{ github.event_name }}"
          echo "[Detect Version Change] Ref: ${{ github.ref }}"
          echo "[Detect Version Change] Ref name: ${{ github.ref_name }}"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "[Detect Version Change] Current package.json version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          VERSION_CHANGED="false"
          LATEST_RELEASE_TAG=""
          LATEST_RELEASE_VERSION=""

          echo "[Detect Version Change] Fetching tags..."
          git fetch --force --tags origin

          LATEST_RELEASE_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "[Detect Version Change] Latest release tag: ${LATEST_RELEASE_TAG:-<none>}"

          if [[ -z "$LATEST_RELEASE_TAG" ]]; then
            echo "[Detect Version Change] No existing release tag found. Treating as changed."
            VERSION_CHANGED="true"
          else
            PREV_FILE=$(mktemp)
            if git show "$LATEST_RELEASE_TAG:package.json" > "$PREV_FILE" 2>/dev/null; then
              LATEST_RELEASE_VERSION=$(node -e "const fs=require('fs'); const p=process.argv[1]; const j=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(j.version || '')" "$PREV_FILE")
              echo "[Detect Version Change] package.json version at $LATEST_RELEASE_TAG: ${LATEST_RELEASE_VERSION:-<missing>}"
            else
              LATEST_RELEASE_VERSION=""
              echo "[Detect Version Change] Could not read package.json at $LATEST_RELEASE_TAG. Treating as changed."
            fi
            rm -f "$PREV_FILE"

            if [[ -z "$LATEST_RELEASE_VERSION" || "$LATEST_RELEASE_VERSION" != "$CURRENT_VERSION" ]]; then
              VERSION_CHANGED="true"
            fi
          fi

          echo "[Detect Version Change] Latest release package version: ${LATEST_RELEASE_VERSION:-<none>}"
          echo "[Detect Version Change] version_changed=$VERSION_CHANGED"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"

  build_and_release:
    name: Build and Release Tauri App
    needs: detect_version_change
    runs-on: windows-latest
    timeout-minutes: 90
    if: github.ref_type == 'branch' && github.ref_name == 'master' && needs.detect_version_change.outputs.version_changed == 'true'
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: always
      CARGO_TERM_PROGRESS_WIDTH: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release tag exists
        id: tag_check
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ needs.detect_version_change.outputs.current_version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog from commits
        if: steps.tag_check.outputs.tag_exists == 'false'
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v${{ needs.detect_version_change.outputs.current_version }}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v "^$VERSION$" | head -n 1 || true)
          echo "Previous tag: $PREV_TAG"
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:'%h%x1f%s (%an)%x1f%b%x1e' "$PREV_TAG..HEAD" | awk 'BEGIN { RS="\x1e"; FS="\x1f"; ORS="" } NF { hash=$1; subject=$2; gsub(/^[ \t]*[-*][ \t]*/, "", subject); if (subject == "") { subject = "(no subject)" } printf("- %s (#%s)\n", subject, hash); body=$3; n=split(body, lines, "\n"); for (i=1; i<=n; i++) { line=lines[i]; sub(/\r$/, "", line); if (line == "") { continue } sub(/^[ \t]*/, "", line); if (line ~ /^[-*][ \t]+/) { sub(/^[-*][ \t]+/, "", line) } printf("- %s (#%s)\n", line, hash) } printf("\n") }')
          else
            LOG=$(git log --pretty=format:'%h%x1f%s (%an)%x1f%b%x1e' | awk 'BEGIN { RS="\x1e"; FS="\x1f"; ORS="" } NF { hash=$1; subject=$2; gsub(/^[ \t]*[-*][ \t]*/, "", subject); if (subject == "") { subject = "(no subject)" } printf("- %s (#%s)\n", subject, hash); body=$3; n=split(body, lines, "\n"); for (i=1; i<=n; i++) { line=lines[i]; sub(/\r$/, "", line); if (line == "") { continue } sub(/^[ \t]*/, "", line); if (line ~ /^[-*][ \t]+/) { sub(/^[-*][ \t]+/, "", line) } printf("- %s (#%s)\n", line, hash) } printf("\n") }')
          fi
          if [ -z "$LOG" ]; then
            LOG="No commits found."
          fi
          {
            printf 'changelog<<EOF\n'
            printf '%s' "$LOG"
            printf '\nEOF\n'
          } >> $GITHUB_OUTPUT

      - name: Build and create release
        if: steps.tag_check.outputs.tag_exists == 'false'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.detect_version_change.outputs.current_version }}
          releaseName: GameLibrary v${{ needs.detect_version_change.outputs.current_version }}
          releaseBody: ${{ steps.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
