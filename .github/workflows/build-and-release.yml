name: Build and Release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  detect_version_change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      current_version: ${{ steps.version_check.outputs.current_version }}
      api_only_changes: ${{ steps.version_check.outputs.api_only_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect package version change
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          echo "[Detect Version Change] Event: ${{ github.event_name }}"
          echo "[Detect Version Change] Ref: ${{ github.ref }}"
          echo "[Detect Version Change] Ref name: ${{ github.ref_name }}"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "[Detect Version Change] Current package.json version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          API_ONLY_CHANGES="false"
          if [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            CHANGED_FILES=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
            if [[ -n "$CHANGED_FILES" ]] && ! printf '%s\n' "$CHANGED_FILES" | grep -qvE '^(api/|\.github/workflows/build-and-release\.yml$)'; then
              API_ONLY_CHANGES="true"
            fi
          fi

          echo "[Detect Version Change] api_only_changes=$API_ONLY_CHANGES"
          echo "api_only_changes=$API_ONLY_CHANGES" >> "$GITHUB_OUTPUT"

          VERSION_CHANGED="false"
          LATEST_RELEASE_TAG=""
          LATEST_RELEASE_VERSION=""

          echo "[Detect Version Change] Fetching tags..."
          git fetch --force --tags origin

          LATEST_RELEASE_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "[Detect Version Change] Latest release tag: ${LATEST_RELEASE_TAG:-<none>}"

          if [[ -z "$LATEST_RELEASE_TAG" ]]; then
            echo "[Detect Version Change] No existing release tag found. Treating as changed."
            VERSION_CHANGED="true"
          else
            PREV_FILE=$(mktemp)
            if git show "$LATEST_RELEASE_TAG:package.json" > "$PREV_FILE" 2>/dev/null; then
              LATEST_RELEASE_VERSION=$(node -e "const fs=require('fs'); const p=process.argv[1]; const j=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(j.version || '')" "$PREV_FILE")
              echo "[Detect Version Change] package.json version at $LATEST_RELEASE_TAG: ${LATEST_RELEASE_VERSION:-<missing>}"
            else
              LATEST_RELEASE_VERSION=""
              echo "[Detect Version Change] Could not read package.json at $LATEST_RELEASE_TAG. Treating as changed."
            fi
            rm -f "$PREV_FILE"

            if [[ -z "$LATEST_RELEASE_VERSION" || "$LATEST_RELEASE_VERSION" != "$CURRENT_VERSION" ]]; then
              VERSION_CHANGED="true"
            fi
          fi

          echo "[Detect Version Change] Latest release package version: ${LATEST_RELEASE_VERSION:-<none>}"
          echo "[Detect Version Change] version_changed=$VERSION_CHANGED"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"

  prepare_release:
    name: Prepare Release
    needs: detect_version_change
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref_name == 'master' && needs.detect_version_change.outputs.version_changed == 'true' && needs.detect_version_change.outputs.api_only_changes != 'true'
    permissions:
      contents: read
    outputs:
      tag_exists: ${{ steps.tag_check.outputs.tag_exists }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check if release tag exists
        id: tag_check
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ needs.detect_version_change.outputs.current_version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog from commits
        if: steps.tag_check.outputs.tag_exists == 'false'
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v${{ needs.detect_version_change.outputs.current_version }}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v "^$VERSION$" | head -n 1 || true)
          echo "Previous tag: $PREV_TAG"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          LOG=$(git log --pretty=format:'%s%x09%an%x09%h' "$RANGE" | while IFS=$'\t' read -r SUBJECT AUTHOR HASH; do
            SUBJECT=$(printf '%s' "$SUBJECT" | sed -E 's/^[[:space:]]*-[[:space:]]*//')
            printf -- '- %s (%s) (#%s)\n' "$SUBJECT" "$AUTHOR" "$HASH"
          done)
          if [ -z "$LOG" ]; then
            LOG="No commits found."
          fi
          {
            printf 'changelog<<EOF\n'
            printf '%s' "$LOG"
            printf '\nEOF\n'
          } >> $GITHUB_OUTPUT

  build_platform:
    name: Build and Release ${{ matrix.platform }}
    needs:
      - detect_version_change
      - prepare_release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    if: needs.prepare_release.outputs.tag_exists == 'false'
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: always
      CARGO_TERM_PROGRESS_WIDTH: 80
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            config: src-tauri/tauri.nsis.conf.json
          - platform: Linux
            os: ubuntu-latest
            config: src-tauri/tauri.linux.conf.json
          - platform: macOS
            os: macos-latest
            config: src-tauri/tauri.macos.conf.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version files
        run: pnpm run sync:version

      - name: Build ${{ matrix.platform }} bundle
        shell: bash
        run: pnpm tauri build --config src-tauri/tauri.conf.json --config ${{ matrix.config }}

      - name: Stage ${{ matrix.platform }} release assets
        shell: bash
        env:
          VERSION: ${{ needs.detect_version_change.outputs.current_version }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: v${{ needs.detect_version_change.outputs.current_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          node --input-type=module <<'NODE'
          import { copyFileSync, existsSync, readFileSync, readdirSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const platform = process.env.PLATFORM;
          const bundleRoot = 'src-tauri/target/release/bundle';
          const output = 'release-assets';
          const files = [];

          function findFiles(directory) {
            if (!existsSync(directory)) return;
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) findFiles(path);
              else files.push(path);
            }
          }

          findFiles(bundleRoot);
          const installers = platform === 'Windows'
            ? [['GameLibrary_x64-setup.exe', files.find((file) => file.endsWith('-setup.exe'))]]
            : platform === 'Linux'
              ? [
                  ['GameLibrary_amd64.AppImage', files.find((file) => file.endsWith('.AppImage'))],
                  ['GameLibrary_amd64.deb', files.find((file) => file.endsWith('.deb'))],
                  ['GameLibrary_x86_64.rpm', files.find((file) => file.endsWith('.rpm'))],
                ]
              : [
                  ['GameLibrary_aarch64.app.tar.gz', files.find((file) => file.endsWith('.app.tar.gz'))],
                  ['GameLibrary_aarch64.dmg', files.find((file) => file.endsWith('.dmg'))],
                ];

          if (installers.some(([, installer]) => !installer)) throw new Error(`Missing installer for ${platform}`);

          const platformEntries = {};
          installers.forEach(([targetName, installer]) => {
            const target = join(output, targetName);
            copyFileSync(installer, target);
            const signature = `${installer}.sig`;
            if (targetName.endsWith('.dmg')) {
              if (existsSync(signature)) copyFileSync(signature, `${target}.sig`);
            } else {
              if (!existsSync(signature)) throw new Error(`Missing signature for ${installer}`);
              copyFileSync(signature, `${target}.sig`);
            }

            const key = platform === 'Windows'
              ? 'windows-x86_64'
              : platform === 'Linux'
                ? targetName.endsWith('.AppImage') ? 'linux-x86_64' : targetName.endsWith('.deb') ? 'linux-x86_64-deb' : 'linux-x86_64-rpm'
                : targetName.endsWith('.app.tar.gz') ? 'darwin-aarch64' : null;
            if (key) {
              platformEntries[key] = {
                signature: readFileSync(`${target}.sig`, 'utf8').trim(),
                url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/${targetName}`,
              };
            }
          });

          writeFileSync(join(output, 'platform.json'), JSON.stringify({ version: process.env.VERSION, platforms: platformEntries }, null, 2));
          NODE

      - name: Upload ${{ matrix.platform }} build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets

  publish_release:
    name: Publish unified release
    needs:
      - detect_version_change
      - prepare_release
      - build_platform
    runs-on: ubuntu-latest
    if: needs.prepare_release.outputs.tag_exists == 'false'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.detect_version_change.outputs.current_version }}
      RELEASE_TAG: v${{ needs.detect_version_change.outputs.current_version }}
      RELEASE_NOTES: ${{ needs.prepare_release.outputs.changelog }}

    steps:
      - name: Download platform build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: false

      - name: Merge updater manifests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, writeFileSync } from 'node:fs';
          const manifests = readdirSync('release-assets', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => JSON.parse(readFileSync(`release-assets/${entry.name}/platform.json`, 'utf8')));
          if (manifests.length !== 3) throw new Error(`Expected 3 platform manifests, found ${manifests.length}`);
          const platforms = Object.assign({}, ...manifests.map((manifest) => manifest.platforms));
          writeFileSync('release-assets/latest.json', JSON.stringify({ version: process.env.VERSION, notes: process.env.RELEASE_NOTES, pub_date: new Date().toISOString(), platforms }, null, 2));
          NODE

          find release-assets -type f -name platform.json -delete

      - name: Create release and upload installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GameLibrary $VERSION" \
            --notes-file release-notes.md \
            $(find release-assets -type f -print)
