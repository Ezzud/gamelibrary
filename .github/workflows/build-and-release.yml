name: Build and Release

on:
  push:
    branches:
      - '**'

jobs:
  detect_version_change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      current_version: ${{ steps.version_check.outputs.current_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect package version change
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          echo "[Detect Version Change] Event: ${{ github.event_name }}"
          echo "[Detect Version Change] Ref: ${{ github.ref }}"
          echo "[Detect Version Change] Ref name: ${{ github.ref_name }}"

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "[Detect Version Change] Current package.json version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          VERSION_CHANGED="false"
          LATEST_RELEASE_TAG=""
          LATEST_RELEASE_VERSION=""

          echo "[Detect Version Change] Fetching tags..."
          git fetch --force --tags origin

          LATEST_RELEASE_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "[Detect Version Change] Latest release tag: ${LATEST_RELEASE_TAG:-<none>}"

          if [[ -z "$LATEST_RELEASE_TAG" ]]; then
            echo "[Detect Version Change] No existing release tag found. Treating as changed."
            VERSION_CHANGED="true"
          else
            PREV_FILE=$(mktemp)
            if git show "$LATEST_RELEASE_TAG:package.json" > "$PREV_FILE" 2>/dev/null; then
              LATEST_RELEASE_VERSION=$(node -e "const fs=require('fs'); const p=process.argv[1]; const j=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(j.version || '')" "$PREV_FILE")
              echo "[Detect Version Change] package.json version at $LATEST_RELEASE_TAG: ${LATEST_RELEASE_VERSION:-<missing>}"
            else
              LATEST_RELEASE_VERSION=""
              echo "[Detect Version Change] Could not read package.json at $LATEST_RELEASE_TAG. Treating as changed."
            fi
            rm -f "$PREV_FILE"

            if [[ -z "$LATEST_RELEASE_VERSION" || "$LATEST_RELEASE_VERSION" != "$CURRENT_VERSION" ]]; then
              VERSION_CHANGED="true"
            fi
          fi

          echo "[Detect Version Change] Latest release package version: ${LATEST_RELEASE_VERSION:-<none>}"
          echo "[Detect Version Change] version_changed=$VERSION_CHANGED"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"

  build:
    name: Build Tauri App
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_TERM_PROGRESS_WHEN: always
      CARGO_TERM_PROGRESS_WIDTH: 80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
          if-no-files-found: warn

  release:
    name: Auto Release on Version Change
    needs:
      - detect_version_change
      - build
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && github.ref_name == 'master'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release tag exists
        id: tag_check
        if: needs.detect_version_change.outputs.version_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ needs.detect_version_change.outputs.current_version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log release decision
        shell: bash
        run: |
          echo "[Release] Branch: ${{ github.ref_name }}"
          echo "[Release] Current version: ${{ needs.detect_version_change.outputs.current_version }}"
          echo "[Release] version_changed: ${{ needs.detect_version_change.outputs.version_changed }}"
          echo "[Release] tag_exists: ${{ steps.tag_check.outputs.tag_exists || 'not-checked' }}"

      - name: Download build artifacts
        if: needs.detect_version_change.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: tauri-bundle
          path: dist-artifacts

      - name: Prepare release files
        if: needs.detect_version_change.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.detect_version_change.outputs.current_version }}"
          mkdir -p dist-release

          APP_EXE_SOURCE=$(find dist-artifacts -type f -name 'gamelibrary.exe' | head -n 1)
          SETUP_EXE_SOURCE=$(find dist-artifacts -type f -name "gamelibrary_${VERSION}_x64-setup.exe" | head -n 1)

          if [[ -z "${APP_EXE_SOURCE:-}" ]]; then
            echo "[Release] gamelibrary.exe not found in downloaded artifacts"
            exit 1
          fi

          if [[ -z "${SETUP_EXE_SOURCE:-}" ]]; then
            echo "[Release] gamelibrary_${VERSION}_x64-setup.exe not found in downloaded artifacts"
            exit 1
          fi

          cp "$APP_EXE_SOURCE" dist-release/gamelibrary.exe
          cp "$SETUP_EXE_SOURCE" dist-release/gamelibrary_x64-setup.exe

          echo "[Release] Staged release files:"
          ls -la dist-release


      - name: Generate changelog from commits
        if: needs.detect_version_change.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v${{ needs.detect_version_change.outputs.current_version }}"
          # Find the previous tag
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v "^$VERSION$" | head -n 1 || true)
          echo "Previous tag: $PREV_TAG"
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:'%h%n%s (%an)%n%b%n---END---' "$PREV_TAG..HEAD" | awk 'BEGIN { RS="---END---\n"; ORS="" } NF { n=split($0, lines, "\n"); hash=lines[1]; if (n >= 2 && lines[2] != "") { printf("- %s (#%s)\n", lines[2], hash) } else { printf("- (#%s)\n", hash) } for (i=3; i<=n; i++) { if (lines[i] == "") { printf("  (#%s)\n", hash) } else { printf("  %s (#%s)\n", lines[i], hash) } } printf("\n") }')
          else
            LOG=$(git log --pretty=format:'%h%n%s (%an)%n%b%n---END---' | awk 'BEGIN { RS="---END---\n"; ORS="" } NF { n=split($0, lines, "\n"); hash=lines[1]; if (n >= 2 && lines[2] != "") { printf("- %s (#%s)\n", lines[2], hash) } else { printf("- (#%s)\n", hash) } for (i=3; i<=n; i++) { if (lines[i] == "") { printf("  (#%s)\n", hash) } else { printf("  %s (#%s)\n", lines[i], hash) } } printf("\n") }')
          fi
          if [ -z "$LOG" ]; then
            LOG="No commits found."
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" | while IFS= read -r line; do echo "$line" >> $GITHUB_OUTPUT; done
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        if: needs.detect_version_change.outputs.version_changed == 'true' && steps.tag_check.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect_version_change.outputs.current_version }}
          name: GameLibrary v${{ needs.detect_version_change.outputs.current_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist-release/gamelibrary.exe
            dist-release/gamelibrary_x64-setup.exe
