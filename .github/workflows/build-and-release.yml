name: Build and Release

on:
  push:
    branches:
      - '**'

jobs:
  detect_version_change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.version_check.outputs.version_changed }}
      current_version: ${{ steps.version_check.outputs.current_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect package version change
        id: version_check
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          BEFORE_SHA="${{ github.event.before }}"
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [[ "$BEFORE_SHA" == "$ZERO_SHA" ]]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV_FILE=$(mktemp)
          if git show "$BEFORE_SHA:package.json" > "$PREV_FILE" 2>/dev/null; then
            PREV_VERSION=$(node -e "const fs=require('fs'); const p=process.argv[1]; const j=JSON.parse(fs.readFileSync(p,'utf8')); process.stdout.write(j.version || '')" "$PREV_FILE")
          else
            PREV_VERSION=""
          fi
          rm -f "$PREV_FILE"

          if [[ -z "$PREV_VERSION" || "$PREV_VERSION" != "$CURRENT_VERSION" ]]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Tauri App
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
          if-no-files-found: warn

  release:
    name: Auto Release on Version Change
    needs:
      - detect_version_change
      - build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.detect_version_change.outputs.version_changed == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release tag exists
        id: tag_check
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ needs.detect_version_change.outputs.current_version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.tag_check.outputs.tag_exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: tauri-bundle
          path: dist-artifacts

      - name: Create GitHub release
        if: steps.tag_check.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect_version_change.outputs.current_version }}
          name: GameLibrary v${{ needs.detect_version_change.outputs.current_version }}
          generate_release_notes: true
          files: |
            dist-artifacts/**
